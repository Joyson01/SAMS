version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atteddel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-atteddel_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-atteddel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: atteddel_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atteddel_db}"
      DATABASE_SYNC_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atteddel_db}"
      ENVIRONMENT: "production"
      DEBUG: "false"
      DATABASE_FALLBACK_SQLITE: "false"
      FORWARDED_ALLOW_IPS: "*"
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"
      SECRET_KEY: "${SECRET_KEY:?Set a unique SECRET_KEY}"
      BACKEND_CORS_ORIGINS: "${BACKEND_CORS_ORIGINS:-[]}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - insightface_cache:/root/.insightface
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: atteddel_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./infra/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
    driver: local
  insightface_cache:
    driver: local

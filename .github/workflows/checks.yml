name: Release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libgomp1
      - run: python -m pip install -r requirements.txt
      - name: Test database bootstrap and campus workflows
        run: >-
          python -m pytest -q
          tests/integration/test_database_bootstrap.py
          tests/integration/test_account_setup.py
          tests/integration/test_student_portal_requests.py
          tests/integration/test_student_timetable.py
          tests/integration/test_classmates.py
          tests/integration/test_semester_results.py
          tests/integration/test_academic_setup.py
          tests/test_classroom.py

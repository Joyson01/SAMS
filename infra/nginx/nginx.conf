map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP Server — Health checks + Redirect to HTTPS
server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    # Allow local container/load-balancer health checks over HTTP
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Redirect all other traffic to HTTPS to enforce Secure Context for rear-camera getUserMedia
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server — SSL Termination for Phone Camera & Secure PWA Context
server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 25M;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Static Frontend Single Page Application
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Backend REST API & Streaming
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_cache_bypass $http_upgrade;
    }

    # Dedicated WebSocket Route
    location /ws/ {
        proxy_pass http://backend:8000/api/v1/recognition/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static Media Mounts
    location /outputs/ {
        proxy_pass http://backend:8000/outputs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /processed/ {
        proxy_pass http://backend:8000/processed/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Top-Level Health Check
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

[project]
name = "local-photo-attendance"
version = "0.1.0"
description = "A simple local photo attendance system"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic==1.17.1",
  "fastapi==0.121.1",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "pillow==12.0.0",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.44",
  "uvicorn==0.38.0",
]

[project.optional-dependencies]
ai = [
  "insightface==0.7.3",
  "onnxruntime==1.23.2",
]
dev = ["pytest==9.0.1"]

[project.scripts]
attendance-app = "attendance_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attendance_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
